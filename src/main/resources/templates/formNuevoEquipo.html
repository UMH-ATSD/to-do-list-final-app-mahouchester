<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="fragments :: head (titulo='Crear Nuevo Equipo')"></head>

    <body>
        <nav th:replace="fragments :: menu"></nav>

        <div class="container">
            <div class="row justify-content-center mb-3 mt-5">
                <div class="col-auto">
                    <h2>Crear Nuevo Equipo</h2>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form method="post" th:action="@{/equipos/nuevo}" th:object="${equipoData}">
                        <div class="form-group">
                            <label for="nombre">Nombre del Equipo</label>
                            <input id="nombre"
                                   class="form-control"
                                   name="nombre"
                                   placeholder="Nombre del equipo"
                                   type="text"
                                   th:field="*{nombre}"
                                   required/>
                        </div>
                    
                        <div class="form-group mt-3">
                            <label for="descripcion">Descripción del Equipo</label>
                            <textarea id="descripcion"
                                      class="form-control"
                                      name="descripcion"
                                      placeholder="Describe brevemente el equipo"
                                      th:field="*{descripcion}"
                                      rows="3"></textarea>
                        </div>
                    
                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary">Crear Equipo</button>
                            <a class="btn btn-link" th:href="@{/equipos}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
